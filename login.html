<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="./bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="./auth-responsive.css">
     <title>Sign In</title>
</head>
<body class="bg-light">
     <form action="" class="auth-form shadow rounded" id="handleSubmit">
          <div class="text-center">
               <h1 class="">Sign In</h1>
          </div>
          <div>
               <label for="email">Email</label>
               <input type="text" class="form-control" placeholder="email" id="email" required  >
          </div>
          <div>
               <label for="password">Password</label>
               <input type="text" class="form-control" placeholder="password" id="password"  required >
          </div>
          <div class=" p-3">
               <button type="submit" class="btn btn-outline-secondary w-100">SignIn</button>
          </div> 
          <div class="text-center">
               <p>Don't Have An Account <a href="./signup.html">SignUp</a></p>
          </div>         
     </form>
</body>
</html>
<script>
     let handleSubmit = document.getElementById("handleSubmit")

     handleSubmit.addEventListener('submit', (event)=>{
          event.preventDefault();
          let email = document.getElementById("email").value;
          let password = document.getElementById("password").value;

          let user = JSON.parse(localStorage.getItem("UserDetail")) || []
          let person = user.find(u => u.email === email && u.password === password)
          
          if(person){
               localStorage.setItem("presentUser", JSON.stringify(person))
               location.href = "./index.html"
          }else{
               alert("wrong login")
          }
     })
</script>
